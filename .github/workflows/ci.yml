name: CI

on:
  push

jobs:
  linux:
    name: Linux
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 21 ]
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        run: |
          sudo apt install openjdk-21-jdk ant
          sudo update-alternatives --set java /usr/lib/jvm/java-21-openjdk-${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}/bin/java

      - name: Shared Ivy Cache
        uses: actions/cache@v5
        with:
          path: ~/.ivy2
          # We use a unique key for each run to ensure the cache is updated if needed,
          # while restoring from the most recent "ivy-shared-" cache.
          key: ivy-shared-${{ github.run_id }}
          restore-keys: |
            ivy-shared-
          enableCrossOsArchive: true

      - name: Build Ivy project
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}/
          cd doc/Example-Ivy-Project
          ant compile

      - name: Show solver table
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}/
          cd doc/Example-Ivy-Project
          ant package
          java -jar javasmt-ivy-example.jar 

      - name: Run tests
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}/
          cd doc/Example-Ivy-Project
          ant test

      - name: Upload error log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: error-logs
          path: doc/Example-Ivy-Project/hs*
