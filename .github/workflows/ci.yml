name: CI

on:
  push

jobs:
  maven:
    name: Maven
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 21 ]
        arch: [ x64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Shared Maven Cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          # We use a unique key for each run to ensure the cache is updated if needed,
          # while restoring from the most recent "ivy-shared-" cache.
          key: maven-shared-${{ github.run_id }}
          restore-keys: |
            maven-shared-
          enableCrossOsArchive: true

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          architecture: ${{ matrix.arch }}

      - name: Build Maven example project
        run: |
          cd doc/Example-Maven-Project
          mvn -DskipTests compile

      - name: Show solver table
        run: |
          cd doc/Example-Maven-Project
          mvn exec:exec

      - name: Run tests
        run: |
          cd doc/Example-Maven-Project
          mvn test

      - name: Upload error log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: doc/Example-Maven-Project/hs*
          archive: false

  kotlin:
    name: Kotlin
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 21 ]
        arch: [ x64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Shared Maven Cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          # We use a unique key for each run to ensure the cache is updated if needed,
          # while restoring from the most recent "maven-shared-" cache.
          key: maven-shared-${{ github.run_id }}
          restore-keys: |
            maven-shared-
          enableCrossOsArchive: true

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          architecture: ${{ matrix.arch }}

      - name: Install Gradle wrapper
        run: |
          cd doc/Example-Gradle-Project-Kotlin
          gradle wrapper --gradle-version latest

      - name: Build Kotlin example project
        run: |
          cd doc/Example-Gradle-Project-Kotlin
          ./gradlew build -x test

      - name: Show solver table
        run: |
          cd doc/Example-Gradle-Project-Kotlin
          ./gradlew build

      - name: Run tests
        run: |
          cd doc/Example-Gradle-Project-Kotlin
          ./gradlew test

  ivy:
    name: Ivy
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 21 ]
        arch: [ x64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Shared Ivy Cache
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/repository
          # We use a unique key for each run to ensure the cache is updated if needed,
          # while restoring from the most recent "ivy-shared-" cache.
          key: ivy-shared-${{ github.run_id }}
          restore-keys: |
            ivy-shared-
          enableCrossOsArchive: true

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          architecture: ${{ matrix.arch }}

      - name: Build Ivy project
        run: |
          cd doc/Example-Ivy-Project
          ant compile

      - name: Show solver table
        run: |
          cd doc/Example-Ivy-Project
          ant run

      - name: Run tests
        run: |
          cd doc/Example-Ivy-Project
          ant test
