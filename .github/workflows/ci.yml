name: CI

on:
  push

jobs:
  linux:
    name: Linux
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 21 ]
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        run: sudo apt install openjdk-21-jdk ant

      - name: Shared Ivy Cache
        uses: actions/cache@v5
        with:
          path: ~/.ivy2
          # We use a unique key for each run to ensure the cache is updated if needed,
          # while restoring from the most recent "ivy-shared-" cache.
          key: ivy-shared-${{ github.run_id }}
          restore-keys: |
            ivy-shared-
          enableCrossOsArchive: true

      - name: Use gcc 14
        run: |          
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/g++-14 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 10

      - name: Print C++ runtime version
        run: |        
          g++ --version
          gcc --version
          apt-cache show libstdc++6
          apt-cache show libgcc-s1
          /lib/x86_64-linux-gnu/libc.so.6
          sha256sum /lib/x86_64-linux-gnu/libstdc++.so.6
          sha256sum /lib/x86_64-linux-gnu/libm.so.6
          sha256sum /lib/x86_64-linux-gnu/libgcc_s.so.1
          sha256sum /lib/x86_64-linux-gnu/libc.so.6

      - name: Build Ivy project
        run: |
          cd doc/Example-Ivy-Project
          ant compile

      - name: Show CVC5 dependencies
        run: |
          cd doc/Example-Ivy-Project/lib/native/x86_64-linux
          ldd -v libcvc5jni.so
          sha256sum libcvc5jni.so

      - name: Show solver table
        run: |
          cd doc/Example-Ivy-Project
          ant run

      - name: Run tests
        run: |
          cd doc/Example-Ivy-Project
          ant test

      - name: Upload error log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: error-logs
          path: doc/Example-Ivy-Project/hs*
